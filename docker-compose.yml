version: '3.8'

services:
  # Banco de dados relacional para persistência de dados dos microsserviços
  postgres:
    image: postgres:15-alpine
    container_name: postgres_microservices
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: microservices_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d microservices_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Broker para comunicação assíncrona orientada a eventos
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_microservices
    restart: unless-stopped
    ports:
      - "5672:5672"      # Porta de comunicação AMQP
      - "15672:15672"    # Porta do painel de gerenciamento HTTP (Management Plugin)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microservices_network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Rede bridge dedicada para comunicação segura entre microsserviços
  microservices_network:
    driver: bridge
    name: microservices_net

volumes:
  # Volumes nomeados para persistência durável de dados
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
