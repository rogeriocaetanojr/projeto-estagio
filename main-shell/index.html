<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Shell - Micro-Frontends</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <h1>Portal Institucional</h1>
    </header>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 20px;">
        <education-application></education-application>
        <community-application></community-application>
        <inventory-application></inventory-application>
    </div>

    <!-- Import Map para resolver dependências nativamente no navegador (Frameworkless) -->
    <script type="importmap">
        {
            "imports": {
                "lit": "https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js"
            }
        }
    </script>

    <!-- Importação direta dos componentes dos respectivos serviços -->
    <script type="module" src="http://localhost:3003/app-bundle/education-element.js"></script>
    <script type="module" src="http://localhost:3002/app-bundle/community-element.js"></script>
    <script type="module" src="http://localhost:3004/app-bundle/inventory-element.js"></script>
</body>
</html>
