<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Shell - Micro-Frontends</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <h1>Portal Institucional</h1>
    </header>

    <div class="app-container">
        <aside class="app-sidebar">
            <nav>
                <ul>
                    <li><button onclick="loadMicroFrontend('community', 'http://localhost:3002/app-bundle/community-element.js', 'community-application')">Comunidade</button></li>
                    <li><button onclick="loadMicroFrontend('education', '../education-service/public/education-element.js', 'education-application')">Educação</button></li>
                    <li><button onclick="loadMicroFrontend('inventory', '../inventory-service/public/inventory-element.js', 'inventory-application')">Inventário</button></li>
                </ul>
            </nav>
        </aside>

        <main id="app-viewport">
            <!-- Micro-frontends serão injetados aqui -->
            <h2>Bem-vindo ao Portal</h2>
            <p>Selecione um módulo no menu lateral para carregar o Micro-Frontend correspondente.</p>
        </main>
    </div>

    <!-- ES Modules suportado nativamente -->
    <script type="module" src="app.js"></script>
</body>
</html>
